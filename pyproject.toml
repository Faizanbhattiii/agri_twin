[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agritwin"
version = "0.1.0"
description = "AgriTwin Pakistan — Hybrid Digital Twin of Pakistani Farmland for Wheat Monitoring and Yield Forecasting"
readme = "README.md"
authors = [
    { name = "M Faizan Bhatti", email = "faizan@example.com" },
    { name = "Mohib Khan", email = "mohib@example.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.1",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "sqlalchemy>=2.0.30",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "torch>=2.2.0",
    "scikit-learn>=1.4.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agritwin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
